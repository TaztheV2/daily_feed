<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            font-family: Georgia, 'Times New Roman', serif;
            margin: 0;
            min-height: 100vh;
            padding: 18px 12px;
        }

        #formContainer {
            background: white;
            border: 10px solid #063d9b;
            border-radius: 42px;
            margin: 0 auto;
            max-width: 420px;
            overflow: hidden;
            position: relative;
        }

        .hero {
            background: linear-gradient(#0004, #0004), url('images/jesus_feeds_5000.jpeg') center/cover;
            height: 160px;
            position: relative;
        }

        .hero h1, .hero p {
            color: white;
            margin: 0;
            position: absolute;
            text-align: center;
            text-shadow: 2px 2px 2px #000;
            width: 100%;
        }

        .hero h1 {
            font-size: 34px;
            top: 62px;
        }

        .hero p {
            font-size: 24px;
            font-weight: bold;
            top: 105px;
        }

        h3 {
            font-size: 20px;
            margin: 20px 8px;
            text-align: center;
        }

        form {
            padding: 0 20px 105px;
        }

        label {
            display: inline-block;
            font-size: 16px;
        }

        .field {
            align-items: center;
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 12px;
            margin: 15px 0;
        }

        .field input {
            min-width: 0;
            padding: 5px;
            width: 100%;
        }

        .gender-row, .check-row, .submit-row {
            text-align: center;
            margin-top: 18px;
        }

        .gender-row > label:first-child {
            margin-right: 18px;
        }

        .check-row label { margin-left: 4px; }

        .books {
            background: #252525;
            color: #c9a66b;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            height: 100px;
        }

        .books div {
            align-items: center;
            border-right: 3px solid #c9a66b;
            display: flex;
            font-size: 10px;
            justify-content: center;
            padding: 5px;
            text-align: center;
        }

        #closeBtn {
            left: 15px;
            position: absolute;
            top: 12px;
            z-index: 2;
        }

        button[type='submit'] {
            margin: 8px 0;
        }

        #output {
            background: white;
            margin: 18px auto;
            max-width: 420px;
            padding: 15px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div class="hero">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <p>Scripture a Day</p>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <div class="field"><label for="username">User Name:</label><input type="text" id="username" name="username" required></div>
            <div class="field"><label for="password">Password:</label><input type="password" id="password" name="password" required></div>
            <div class="field"><label for="email">Email:</label><input type="email" id="email" name="email" required></div>
            <div class="gender-row">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
            <div class="check-row">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </div>
            <div class="check-row">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </div>
            <div class="submit-row">
                <button type="submit">Submit</button>
            </div>
        </form>
        <div class="books"><div>OLD<br>TESTAMENT</div><div>NEW<br>TESTAMENT</div><div>BOOK OF<br>MORMON</div><div>DOCTRINE AND<br>COVENANTS</div><div>PEARL OF<br>GREAT PRICE</div></div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
